<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>타자 시점 야구</title>
    <meta name="theme-color" content="#0f1c30" />
    <!-- 매니페스트는 http/https에서만 연결 (file://에서는 Chrome이 CORS 오류를 남김) -->
    <script>
      if (/^https?:$/.test(location.protocol)) {
        var m = document.createElement('link');
        m.rel = 'manifest';
        m.href = './manifest.webmanifest';
        document.head.appendChild(m);
      }
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <!-- iOS 홈 화면 추가 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="타자 야구" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <canvas id="game" width="1280" height="720"></canvas>

    <!-- 기록 백업 (내보내기/가져오기, 서버 없음) -->
    <div id="backup-dialog" class="dialog" hidden>
      <div class="dialog-box wide" role="dialog" aria-labelledby="backup-title">
        <h2 id="backup-title">기록 백업</h2>
        <p class="dialog-note">다른 기기로 기록을 옮길 때 씁니다. 기록은 이 기기에만 저장되고 서버로 보내지 않습니다.</p>
        <h3>내보내기</h3>
        <textarea id="export-text" readonly rows="3" spellcheck="false"></textarea>
        <div class="dialog-actions start">
          <button type="button" id="export-copy">복사</button>
          <button type="button" id="export-file">파일로 저장</button>
        </div>
        <h3>가져오기</h3>
        <textarea id="import-text" rows="3" spellcheck="false" placeholder="다른 기기에서 내보낸 기록을 붙여넣으세요"></textarea>
        <div class="dialog-actions start">
          <button type="button" id="import-paste" class="primary">붙여넣은 기록 가져오기</button>
          <button type="button" id="import-file-btn">파일에서 가져오기</button>
          <input type="file" id="import-file" accept=".json,application/json,text/plain" hidden />
        </div>
        <p id="backup-msg" class="dialog-msg" aria-live="polite"></p>
        <div class="dialog-actions">
          <button type="button" id="backup-close">닫기</button>
        </div>
      </div>
    </div>

    <!-- 터치 패드 (터치 기기의 게임 화면에서만). 존을 직접 누르면 손가락이 공을 가리기 때문 -->
    <div id="touch-pad" hidden aria-label="타격 패드">
      <button type="button" data-row="0" data-col="0"></button><button type="button" data-row="0" data-col="1"></button><button type="button" data-row="0" data-col="2"></button>
      <button type="button" data-row="1" data-col="0"></button><button type="button" data-row="1" data-col="1"></button><button type="button" data-row="1" data-col="2"></button>
      <button type="button" data-row="2" data-col="0"></button><button type="button" data-row="2" data-col="1"></button><button type="button" data-row="2" data-col="2"></button>
    </div>

    <!-- 세로 화면 안내 -->
    <div id="rotate" hidden>
      <div class="rotate-box">
        <div class="rotate-icon" aria-hidden="true"></div>
        <p>폰을 가로로 돌려주세요</p>
      </div>
    </div>

    <!-- 타자 이름 입력 대화상자 -->
    <div id="name-dialog" class="dialog" hidden>
      <form id="name-form" class="dialog-box" autocomplete="off" novalidate>
        <h2>타자 이름</h2>
        <div class="bats" role="radiogroup" aria-label="타석">
          <label><input type="radio" name="bats" value="R" checked /><span>우타</span></label>
          <label><input type="radio" name="bats" value="L" /><span>좌타</span></label>
        </div>
        <input id="name-input" type="text" maxlength="8" placeholder="이름 (1~8자)" enterkeyhint="done" spellcheck="false" />
        <p id="name-error" class="dialog-error" aria-live="polite"></p>
        <div id="name-list" class="chips"></div>
        <div class="dialog-actions">
          <button type="button" id="name-cancel">취소</button>
          <button type="submit" class="primary">확인</button>
        </div>
      </form>
    </div>

    <!-- ES module 대신 일반 script (file://에서도 동작). 순서 중요 -->
    <script src="./js/config.js"></script>
    <script src="./js/rng.js"></script>
    <script src="./js/pitcher.js"></script>
    <script src="./js/judge.js"></script>
    <script src="./js/game.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/sounds-data.js"></script>
    <script src="./js/audio.js"></script>
    <script src="./js/scene.js"></script>
    <script src="./js/renderer.js"></script>
    <script src="./js/input.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
